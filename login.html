<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C:\Users\55859\OneDrive\Documentos\Projetos\src\style\login.css">
    <title>LOGIN</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <header>
        <img src="file:///C:/Users/55859/OneDrive/Documentos/Projetos/src/img/Book%20open.svg" class="icone-bibliotech">
        <h1 class="titulo-bibliotech">BIBLIOTECH</h1>

    </header>
    <section>
        <article>
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" placeholder="E-mail" required>
                <i class='bx bxs-user'></i>
                
            </div>
            <div class="input-box">
                <input type="password" placeholder="Senha" required>
                <i class='bx bx-lock-alt'></i>

            </div>
            <div class="remenber-forgot">
                <label><input type="checkbox">Lembre-me</label>
                <a href="#">Esqueceu a senha?</a>
            </div>
            <button type="submit" class="btn-login">Login</button>

            <div class="register">
                <p>Não possui uma conta? <a href="#">Cadastrar-se</a></p>
            </div>

        </article>

    </section>
    <footer>
        <p class="mensagem-footer">Seja bem-vindo á BIBLIOTECH, 
            uma biblioteca digital totalmente autonoma e de boa qualidade!</p>


    </footer>

    
</body>
</html>
