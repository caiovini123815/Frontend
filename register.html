<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C:\Users\55859\OneDrive\Documentos\Projetos\src\style\register.css">
    <title>CADASTRAR-SE</title>
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
     <header>
        <img src="file:///C:/Users/55859/OneDrive/Documentos/Projetos/src/img/Book%20open.svg" class="icone-bibliotech">
        <h1 class="titulo-bibliotech">BIBLIOTECH</h1>

    </header>
    <section>
        <article>
            <button type="button" class="btn-return"><i1 class='bx bx-caret-left'></i1></button>
            <h1>Cadastro</h1>
             <div class="input-box">
                <input type="text" placeholder="Nome Completo" required>
                <i class='bx bx-rename' ></i>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email" required>
                <i class='bx bx-envelope' ></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="CPF" required>
                <i class='bx bxs-user-pin'></i>
            </div>
            <div class="input-box">
                <input type="date" placeholder="Data de Nascimento" required>
                <i class='bx bxs-calendar'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Telefone" required>
                <i class='bx bxs-phone'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Endereço" required>
                <i class='bx bxs-building-house'></i>
            </div>
            
             
            <div class="remenber-forgot">
                <label><input type="checkbox">Lembre-me</label>
            </div>
            <button type="submit" class="btn-register">Cadastrar</button>

        </article>

    </section>
    <footer>
        <p class="mensagem-footer">- Seja bem-vindo á BIBLIOTECH, 
            uma biblioteca digital totalmente autonoma e de boa qualidade!</p>


    </footer>

</body>
</html>
